services:
  actual-http-api:
    image: jhonderson/actual-http-api:latest
    container_name: actual-http-api
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    environment:
      - ACTUAL_SERVER_URL=http://127.0.0.1:5006
      - ACTUAL_SERVER_PASSWORD=${ACTUAL_SERVER_PASSWORD}
      - API_KEY=${ACTUAL_HTTP_API_KEY:-actual-secret-key-automation}
      - ACTUAL_DATA_DIR=/data
      - SWAGGER_PROTOCOL=http
      - SWAGGER_PORT=5007
      - EXPERIMENTAL_OPERATIONS_ENABLED=true
    volumes:
      - ./http-api-data:/data:Z
